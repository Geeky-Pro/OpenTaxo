name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/supabase-owner-auth

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/supabase-owner-auth'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/supabase-owner-auth
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile with compatible security fixes
        run: |
          npm audit fix --package-lock-only || true
          npm install --package-lock-only
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile from security audit"
          git push origin HEAD:refs/heads/feat/supabase-owner-auth

  verify:
    if: always()
    needs: refresh-lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const r=require('/tmp/npm-audit.json'); console.log('Dependency audit totals:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, v] of Object.entries(r.vulnerabilities ?? {})) console.log(JSON.stringify({name, severity:v.severity, range:v.range, via:v.via, nodes:v.nodes, fixAvailable:v.fixAvailable}));"
      - name: Type check
        run: npx tsc --noEmit
      - name: Verify taxonomy tree and domain rules
        run: npx tsx scripts/verify-tree-utils.ts
      - name: Verify attribute data-type and filter compatibility
        run: npx tsx scripts/verify-attribute-compatibility.ts
      - name: Lint changed auth and integration files
        run: >-
          npx eslint proxy.ts eslint.config.mjs lib/supabase lib/auth lib/data app/login/page.tsx app/unauthorized/page.tsx app/attributes/page.tsx app/api/export/route.ts app/api/upload/route.ts app/actions/search-actions.ts lib/actions/categories.ts lib/actions/attributes.ts lib/actions/category-details.ts components/layout/AppNavbar.tsx components/layout/MobileNav.tsx components/category-details/CategoryDetailClient.tsx components/category-details/AttributeBindingSection.tsx lib/actions/product-type-attributes.ts lib/data/product-type-editor.ts app/definitions/page.tsx app/data-types/page.tsx components/attributes/AttributeDefinitionManager.tsx lib/actions/attribute-definitions.ts lib/data/attribute-definitions.ts lib/domain/attribute-compatibility.ts lib/types/attribute-definition.ts scripts/verify-attribute-compatibility.ts app/page.tsx components/values/ValueSetManager.tsx components/measurements/MeasurementCenterManager.tsx components/measurements/UnitConversionManager.tsx lib/actions/value-sets.ts lib/actions/measurements.ts lib/data/value-sets.ts lib/data/measurements.ts lib/domain/measurement-conversions.ts app/value-sets/page.tsx app/measurements/page.tsx app/unit-conversions/page.tsx scripts/verify-measurement-conversions.ts
      - name: Verify measurement conversion formulas
        run: npx tsx scripts/verify-measurement-conversions.ts
      - name: Build
        run: npm run build
